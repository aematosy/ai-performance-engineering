[project]
name = "demo-agent-perf"
version = "0.1.0"
description = "AI-assisted Performance Engineering platform"
authors = [
    {name = "Adrian Matos"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "reportlab (>=5.0.1,<6.0.0)",
    "locust (>=2.46.6,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
